communication:
  protocol: modbus_rtu
  port: COM7
  slave_id: 9
  baudrate: 115200
  bytesize: 8
  parity: N
  stopbits: 1

simulation:
  update_interval: 0.2
  input_voltage: 220.0
  output_time_constant: 1.5
  max_output_voltage: 60.0
  off_residual_voltage: 0.15

environment_models:
  enabled: true
  current_model_file: current_model_v1.joblib
  tb_model_file: tb_history_model_v1.joblib
  update_interval: 1.0
  valid_voltage_min: 42.10
  valid_voltage_max: 45.10
  model_voltage_min: 43.3133
  model_voltage_max: 43.9525
  current_control_gain: 0.17
  max_delta_v_per_step: 0.2
  tb_control_weight: 10.0
  tb_control_limit: 3.0
  initial_current: 0.15
  reference_current: 5.91
  initial_tb: -1593.0
  off_residual_current: 0.15
  fallback_resistance: 7.37

tb:
  start_address: 10
  registers_per_device: 7
  max_count: 16
  active_count: 1
  fields:
    - {offset: 0, name: min_potential, label: 최소 설정전위, access: rw, initial: 850, multiplier: -1, unit: mV}
    - {offset: 1, name: max_potential, label: 최대 설정전위, access: rw, initial: 2500, multiplier: -1, unit: mV}
    - {offset: 2, name: measured_potential, label: 측정전위, access: r, initial: 1593, multiplier: -1, unit: mV}
    - {offset: 3, name: battery_voltage, label: 배터리 전압, access: r, initial: 370, divisor: 100, unit: V}
    - {offset: 4, name: temperature, label: 온도, access: r, initial: 250, divisor: 10, unit: ℃}
    - {offset: 5, name: humidity, label: 습도, access: r, initial: 500, divisor: 10, unit: "%"}
    - {offset: 6, name: status, label: 상태코드, access: r, initial: 0}

registers:
  - address: 0
    name: board_status
    label: 보드 상태
    access: rw
    initial: 1
    values: {0: 준비, 1: 완료, 2: 스킵}
  - address: 1
    name: power_status
    label: ON/OFF 상태
    access: rw
    initial: 0
    values: {0: "OFF", 1: "ON"}
  - address: 2
    name: control_mode
    label: 운전 모드
    access: rw
    initial: 0
    values: {0: 자동, 1: 수동, 2: 탐색}
  - {address: 3, name: set_voltage, label: 설정전압, access: rw, initial: 0, divisor: 10, unit: V}
  - {address: 4, name: input_voltage, label: 입력전압, access: r, initial: 0, divisor: 10, unit: V}
  - {address: 5, name: output_voltage, label: 출력전압, access: r, initial: 0, divisor: 10, unit: V}
  - {address: 6, name: output_current, label: 출력전류, access: r, initial: 0, divisor: 10, unit: A}
  - {address: 7, name: rectifier_temperature, label: 정류기 온도, access: r, initial: 250, divisor: 10, unit: ℃}
  - {address: 8, name: rectifier_humidity, label: 정류기 습도, access: r, initial: 500, divisor: 10, unit: "%"}
  - {address: 9, name: rf_status, label: RF 상태코드, access: r, initial: 0}
